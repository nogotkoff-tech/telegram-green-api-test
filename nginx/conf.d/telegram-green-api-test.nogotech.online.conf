upstream gata_proxy_backend {
    server gata-proxy-webhooks:3000;
    keepalive 32;
}

# Redirect HTTP to HTTPS, keep ACME open for certificate renewals
server {
    listen 80;
    listen [::]:80;
    server_name telegram-green-api-test.nogotech.online;

    location /.well-known/acme-challenge/ {
        root /etc/nginx/ssl/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name telegram-green-api-test.nogotech.online;

    ssl_certificate     /etc/nginx/ssl/certbot_etc/live/telegram-green-api-test.nogotech.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/certbot_etc/live/telegram-green-api-test.nogotech.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    # 1) Server-Sent Events (SSE) streaming endpoint
    location ~* ^/(green-api/events|green-api/sse|events|sse) {
        proxy_pass http://gata_proxy_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2) Webhooks from Green API
    location ~* ^/(green-api/webhook|webhook) {
        proxy_pass http://gata_proxy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3) Healthcheck and general API routing
    location / {
        proxy_pass http://gata_proxy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
