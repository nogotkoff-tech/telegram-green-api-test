# ==============================================================================
# Nginx Virtual Host: telegram-green-api-test.nogotech.online
# Разместите этот файл в конфигурации вашего главного Nginx (/opt/andrey-nogotkov.ru)
# Например: /opt/andrey-nogotkov.ru/nginx/conf.d/telegram-green-api-test.conf
# ==============================================================================

upstream gata_proxy_backend {
    # ВНИМАНИЕ: Если Nginx запущен в Docker на том же VPS:
    # 1) Если Nginx использует network_mode: host -> используйте 127.0.0.1:3000
    # 2) Если обычная bridge-сеть -> используйте IP хоста шлюза (обычно 172.17.0.1:3000)
    #    или host.docker.internal:3000
    # 3) Если оба контейнера в одной сети -> используйте gata-proxy-webhooks:3000
    server 127.0.0.1:3000;
    keepalive 32;
}

# Редирект с HTTP на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name telegram-green-api-test.nogotech.online;

    # Для certbot ACME challenge при получении/продлении сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name telegram-green-api-test.nogotech.online;

    # Пути к сертификатам Certbot Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/telegram-green-api-test.nogotech.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telegram-green-api-test.nogotech.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Максимальный размер тела для входящих вебхуков
    client_max_body_size 20M;

    # 1) Server-Sent Events (SSE) стриминг
    # Важно: отключаем буферизацию и кэширование, выставляем длительный таймаут
    location ~* ^/(green-api/events|green-api/sse|events|sse) {
        proxy_pass http://gata_proxy_backend;
        proxy_http_version 1.1;

        # Отключение буферизации для real-time SSE
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Таймаут ожидания соединения (24 часа)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Заголовки хоста и IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2) Вебхуки от сервиса Green API
    location ~* ^/(green-api/webhook|webhook) {
        proxy_pass http://gata_proxy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3) Healthcheck и корневой эндпоинт
    location / {
        proxy_pass http://gata_proxy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
