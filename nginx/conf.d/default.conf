upstream proxy_webhooks {
    server proxy-webhooks:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Client body size for webhook payloads
    client_max_body_size 20M;

    # Gzip settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Let's Encrypt / Certbot ACME challenge support for automated SSL renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 1) Server-Sent Events (SSE) streaming endpoint
    # CRITICAL: Buffering must be disabled and timeouts set high for persistent SSE stream
    location ~* ^/(green-api/events|green-api/sse|events|sse) {
        proxy_pass http://proxy_webhooks;
        proxy_http_version 1.1;

        # Disable buffering and chunked transfer encoding for SSE
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Long timeout for SSE persistent connections (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2) Webhook receiving endpoints from Green API
    location ~* ^/(green-api/webhook|webhook) {
        proxy_pass http://proxy_webhooks;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3) Healthcheck endpoints
    location ~* ^/(health|green-api/health) {
        proxy_pass http://proxy_webhooks;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4) Root and general API routing
    location / {
        proxy_pass http://proxy_webhooks;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
